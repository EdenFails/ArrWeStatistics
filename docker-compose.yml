version: '3.8'

services:
  arrwestatistics:
    image: ghcr.io/edenfails/arrwestatistics:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arrwestatistics
    restart: unless-stopped
    ports:
      - "8478:8478"
    environment:
      - HOST=0.0.0.0
      - PORT=8478
      - DB_PATH=/app/data/arrwestatistics.db
      - CACHE_TTL_SECONDS=10
    volumes:
      - ./data:/app/data
      - /proc:/host/proc:ro # Host procfs for accurate host network bandwidth, host processes & GPU fdinfo
      # - /mnt/storage:/storage:ro # Optional: Mount your MergerFS pool or host drive for disk & subfolder monitoring
      # - /var/run/docker.sock:/var/run/docker.sock:ro # Optional: Direct Docker container log monitoring (e.g. HandBrake)
    devices:
      - /dev/dri:/dev/dri # Direct host GPU access for telemetry & IOCTL (Intel Arc / Battlemage B580, AMD, etc.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8478/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
